<!DOCTYPE html>
<html>

<head>

    <title>Add Product</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Add Product</h1>

    <form method="POST">

        <label>Product Name</label>

        <input type="text"
               name="name"
               required>

        <label>Quantity</label>

        <input type="number"
               name="quantity"
               min="0"
               required>

        <label>Price</label>

        <input type="number"
               name="price"
               min="0"
               step="0.01"
               required>

        <button type="submit">
            Add Product
        </button>

    </form>

    <br>

    <a href="/">Back to Dashboard</a>

</div>

</body>

</html>
